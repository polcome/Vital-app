<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Vital — Entrenaments</title>

<!-- PWA: instal·lable a la pantalla d'inici -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#3B6FD1">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vital">
<meta name="mobile-web-app-capable" content="yes">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#F6F8FA; --surface:#FFFFFF; --surface-2:#EEF2F6; --border:#E1E7ED;
    --text:#1D2226; --text-muted:#75808A;
    --gym:#3B6FD1; --gym-bg:#E1E9FA; --gym-text:#2A4F9E;
    --classe:#E0954E; --classe-bg:#FBEBDA; --classe-text:#9C5E1E;
    --exterior:#9B4FD9; --exterior-bg:#F1E3FA; --exterior-text:#6B2E96;
    --missed:#D9776A; --missed-bg:#FBE4E0;
    --amber:#DFA84E; --amber-bg:#FAEBD3;
    --day-done-bg:#E4F5EA; --day-pending-bg:#FBE7E3;
    --font-display:'Space Grotesk',sans-serif; --font-body:'Inter',sans-serif; --font-mono:'JetBrains Mono',monospace;
    --radius:14px;
    --shadow:0 1px 2px rgba(20,30,40,.05), 0 2px 8px rgba(20,30,40,.05);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-body);-webkit-font-smoothing:antialiased;padding-bottom:74px;}
  h1,h2,h3{font-family:var(--font-display);font-weight:600;margin:0;}
  .mono{font-family:var(--font-mono);}
  button{font-family:var(--font-body);cursor:pointer;}

  header.top{position:sticky;top:0;z-index:20;background:var(--bg);padding:16px 16px 6px;display:flex;align-items:center;justify-content:space-between;}
  header.top h1{font-size:18px;letter-spacing:0.3px;}
  .btn-icon{width:38px;height:38px;border-radius:12px;background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow);font-size:16px;display:flex;align-items:center;justify-content:center;color:var(--text);}
  .btn-icon:active{border-color:var(--gym);}
  .btn-primary{background:var(--text);color:var(--surface);border:none;border-radius:12px;padding:9px 15px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:5px;box-shadow:var(--shadow);}
  .btn-primary:active{opacity:.85;}
  .btn-secondary{background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:12px;padding:9px 15px;font-size:13px;font-weight:600;box-shadow:var(--shadow);}

  main{max-width:720px;margin:0 auto;padding:0 14px;}

  .seg-toggle{display:flex;background:var(--surface-2);border-radius:11px;padding:3px;gap:2px;}
  .seg-toggle button{background:none;border:none;border-radius:8px;padding:7px 12px;font-size:12.5px;font-weight:600;color:var(--text-muted);}
  .seg-toggle button.active{background:var(--surface);color:var(--text);box-shadow:var(--shadow);}

  .cal-toolbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:6px 0 10px;flex-wrap:wrap;}
  .period-nav{display:flex;align-items:center;gap:10px;justify-content:center;margin:6px 0 14px;}
  .period-nav .nav-btn{width:32px;height:32px;border-radius:9px;background:var(--surface);border:1px solid var(--border);color:var(--text-muted);font-size:15px;display:flex;align-items:center;justify-content:center;}
  .period-nav .nav-btn:active{border-color:var(--gym);color:var(--gym-text);}
  .period-label{font-family:var(--font-display);font-size:15px;text-transform:capitalize;min-width:150px;text-align:center;}

  .page{display:none;}
  .page.active{display:block;}

  .section-title{font-size:11.5px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.8px;margin:18px 0 8px;font-weight:600;}
  .empty{color:var(--text-muted);font-size:13px;padding:22px 0;text-align:center;}

  /* ---- Vista Mes / Setmana (dies alts i llegibles) ---- */
  .weekday-row{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:5px;}
  .weekday-row div{text-align:center;font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.5px;font-weight:600;}
  .cal-week-row{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:4px;}
  .cal-day{height:90px;border-radius:11px;cursor:pointer;border:1px solid var(--border);background:var(--surface);transition:border-color .15s;
    display:flex;flex-direction:column;align-items:stretch;gap:2px;overflow:hidden;padding:4px 3px;}
  .cal-day.outside{opacity:.25;pointer-events:none;}
  .cal-day.past{background:var(--surface-2);}
  .cal-day.day-done{background:var(--day-done-bg);}
  .cal-day.day-pending{background:var(--day-pending-bg);}
  .cal-day.today{border-color:var(--amber);box-shadow:0 0 0 1px var(--amber) inset;}
  .cal-day.expanded-sel{border-color:var(--gym);box-shadow:0 0 0 1px var(--gym) inset;background:var(--gym-bg);}
  .cal-day.today.expanded-sel{border-color:var(--amber);box-shadow:0 0 0 1px var(--amber) inset;background:var(--amber-bg);}
  .cal-day .dnum{font-family:var(--font-mono);font-size:12px;text-align:center;flex-shrink:0;}
  .day-lines{display:flex;flex-direction:column;gap:3px;overflow:hidden;flex:1;min-height:0;}
  .day-line{border-radius:5px;padding:2px 4px;flex-shrink:0;}
  .day-line .dl-time{font-family:var(--font-mono);font-size:9px;font-weight:700;line-height:1.2;}
  .day-line .dl-name{font-size:8.5px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;}
  .day-line.gym{background:var(--gym-bg);color:var(--gym-text);}
  .day-line.classe{background:var(--classe-bg);color:var(--classe-text);}
  .day-line.exterior{background:var(--exterior-bg);color:var(--exterior-text);}
  .day-line.missed{opacity:.55;text-decoration:line-through;}
  .day-line.omesa{opacity:.4;text-decoration:line-through;background:var(--surface-2);color:var(--text-muted);}
  .day-more{font-size:7.5px;color:var(--text-muted);text-align:center;flex-shrink:0;}

  .day-expanded{background:var(--surface);border:1px solid var(--gym);border-radius:var(--radius);padding:14px;margin-bottom:10px;box-shadow:var(--shadow);}
  .day-expanded-title{font-family:var(--font-display);font-size:14.5px;margin-bottom:10px;text-transform:capitalize;}

  .act-row{display:flex;align-items:center;gap:10px;background:var(--surface-2);border-radius:11px;padding:10px 12px;margin-bottom:7px;border-left:4px solid var(--border);}
  .act-row.gym{border-left-color:var(--gym);}
  .act-row.classe{border-left-color:var(--classe);}
  .act-row.exterior{border-left-color:var(--exterior);}
  .act-row.completat{opacity:.6;}
  .act-row.omesa{opacity:.55;background:var(--surface-2);}
  .act-row .time{font-family:var(--font-mono);font-size:12px;color:var(--text-muted);min-width:40px;}
  .act-row .body{flex:1;min-width:0;}
  .act-row .name{font-size:13.5px;font-weight:600;}
  .act-row .name.done{text-decoration:line-through;color:var(--text-muted);}
  .act-row .tag{font-size:10.5px;color:var(--text-muted);}
  .act-row .status{font-size:15px;display:flex;align-items:center;gap:4px;}
  .act-row .chevron{color:var(--text-muted);font-size:17px;font-weight:700;}

  /* ---- Overlay de càrrega ---- */
  .loading-overlay{position:fixed;inset:0;z-index:500;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    background:rgba(246,248,250,.78);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);transition:opacity .2s;}
  .loading-overlay.hidden{opacity:0;pointer-events:none;}
  .loading-spinner-big{width:42px;height:42px;border-radius:50%;border:4px solid var(--border);border-top-color:var(--gym);animation:spin .7s linear infinite;}
  .loading-text{font-size:13px;color:var(--text-muted);font-weight:600;}

  /* ---- Modal ---- */
  .modal-overlay{position:fixed;inset:0;background:rgba(20,22,18,.4);z-index:200;display:none;align-items:flex-end;justify-content:center;}
  .modal-overlay.open{display:flex;}
  .modal-box{background:var(--surface);border-radius:20px 20px 0 0;width:100%;max-width:520px;max-height:88vh;overflow-y:auto;padding:20px 18px calc(20px + env(safe-area-inset-bottom));box-shadow:0 -4px 24px rgba(0,0,0,.15);}
  @media(min-width:560px){ .modal-overlay{align-items:center;} .modal-box{border-radius:20px;max-height:85vh;} }
  .modal-title{font-family:var(--font-display);font-size:17px;margin-bottom:14px;}
  .modal-close{position:absolute;top:14px;right:14px;}

  /* ---- Form ---- */
  .form label{font-size:11.5px;color:var(--text-muted);display:block;margin:10px 0 4px;font-weight:600;}
  .form label:first-child{margin-top:0;}
  .form input, .form select, .form textarea{width:100%;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;color:var(--text);padding:9px 10px;font-size:14px;outline:none;font-family:var(--font-body);}
  .form input:focus, .form select:focus, .form textarea:focus{border-color:var(--gym);}
  .form textarea{resize:vertical;min-height:60px;}
  .form-grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .form-actions{display:flex;gap:8px;margin-top:18px;}
  .form-actions button{flex:1;}
  .btn-danger{background:var(--missed-bg);color:var(--missed);border:none;border-radius:12px;padding:10px;font-size:13px;font-weight:600;}

  .type-picker{display:flex;gap:7px;}
  .type-picker button{flex:1;border-radius:11px;border:1.5px solid var(--border);background:var(--surface);padding:10px 4px;font-size:12px;font-weight:600;color:var(--text-muted);display:flex;flex-direction:column;align-items:center;gap:3px;}
  .type-picker button.sel-gym.active{border-color:var(--gym);background:var(--gym-bg);color:var(--gym-text);}
  .type-picker button.sel-classe.active{border-color:var(--classe);background:var(--classe-bg);color:var(--classe-text);}
  .type-picker button.sel-exterior.active{border-color:var(--exterior);background:var(--exterior-bg);color:var(--exterior-text);}

  .recur-toggle{display:flex;gap:7px;}
  .recur-toggle button{flex:1;border-radius:11px;border:1.5px solid var(--border);background:var(--surface);padding:9px;font-size:12.5px;font-weight:600;color:var(--text-muted);}
  .recur-toggle button.active{border-color:var(--text);background:var(--text);color:var(--surface);}

  .day-chips{display:flex;gap:5px;flex-wrap:wrap;}
  .day-chips button{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--border);background:var(--surface);font-size:12px;font-weight:700;color:var(--text-muted);}
  .day-chips button.active{border-color:var(--gym);background:var(--gym);color:#fff;}

  /* ---- Sliders ---- */
  .slider-wrap{margin:14px 0;}
  .slider-label{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .slider-emoji{font-size:26px;}
  .slider-val{font-family:var(--font-mono);font-size:16px;font-weight:700;}
  input[type="range"]{-webkit-appearance:none;width:100%;height:8px;border-radius:5px;outline:none;}
  input[type="range"]#diffSlider{background:linear-gradient(to right, #5CAE82, #DFA84E, #D9776A);}
  input[type="range"]#satSlider{background:linear-gradient(to right, #D9776A, #DFA84E, #5CAE82);}
  input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:#fff;border:3px solid var(--text);cursor:pointer;box-shadow:var(--shadow);}
  input[type="range"]::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:#fff;border:3px solid var(--text);cursor:pointer;}

  /* ---- Stats ---- */
  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0;}
  .stat-grid.cols3{grid-template-columns:1fr 1fr 1fr;}
  .stat-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);}
  .stat-box .num{font-family:var(--font-mono);font-size:22px;color:var(--gym-text);}
  .stat-box .lbl{font-size:10.5px;color:var(--text-muted);margin-top:3px;}
  .chart-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:14px;height:220px;box-shadow:var(--shadow);}

  .goal-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;margin-bottom:8px;box-shadow:var(--shadow);}
  .goal-card .row{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:6px;}
  .goal-bar{height:8px;background:var(--surface-2);border-radius:5px;overflow:hidden;}
  .goal-bar-fill{height:100%;background:var(--gym);border-radius:5px;}

  .goal-strip{display:flex;gap:6px;overflow-x:auto;padding:4px 0 2px;-webkit-overflow-scrolling:touch;}
  .goal-pill{flex-shrink:0;display:flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:6px 12px;font-size:11px;font-weight:600;white-space:nowrap;box-shadow:var(--shadow);cursor:pointer;}
  .goal-pill.done{border-color:var(--gym);}
  .goal-pill .gp-bar{width:32px;height:5px;border-radius:3px;background:var(--surface-2);overflow:hidden;flex-shrink:0;}
  .goal-pill .gp-fill{height:100%;border-radius:3px;}

  nav.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);display:flex;justify-content:space-around;gap:6px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));z-index:30;}
  nav.tabs button{background:none;border:none;border-radius:12px;color:var(--text-muted);font-size:10.5px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 6px;flex:1;font-weight:600;transition:background .15s,color .15s;}
  nav.tabs button .ic{font-size:18px;}
  nav.tabs button.active{color:var(--gym-text);background:var(--gym-bg);}

  .toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--surface);padding:9px 16px;border-radius:20px;font-size:12.5px;opacity:0;transition:.25s;pointer-events:none;z-index:250;max-width:90vw;text-align:center;}
  .toast.show{opacity:1;pointer-events:auto;}
  .toast-undo{text-decoration:underline;font-weight:700;margin-left:8px;cursor:pointer;}

  .fab-refresh{position:fixed;right:16px;bottom:76px;z-index:40;width:44px;height:44px;border-radius:50%;
    background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);}
  .fab-refresh svg{width:19px;height:19px;stroke:var(--text);transition:transform .5s ease;}
  .fab-refresh.spinning svg{animation:spin .6s linear infinite;}
  @keyframes spin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
</style>
</head>
<body>

<header class="top">
  <div class="seg-toggle" id="mainViewToggle">
    <button data-view="month" class="active">Mes</button>
    <button data-view="week">Setmana</button>
  </div>
  <div style="display:flex;gap:6px;">
    <button class="btn-icon" onclick="openActivitatsList()" title="Totes les activitats">📋</button>
    <button class="btn-primary" onclick="openActivityForm()">+ Nova activitat</button>
  </div>
</header>

<main>

  <!-- ===== PÀGINA: CALENDARI ===== -->
  <section class="page active" id="page-calendar">
    <div id="calGoalsStrip"></div>
    <div class="period-nav">
      <button class="nav-btn" onclick="changePeriod(-1)">‹</button>
      <div class="period-label" id="periodLabel"></div>
      <button class="nav-btn" onclick="changePeriod(1)">›</button>
    </div>

    <div id="calendarWeek" style="display:none;">
      <div class="weekday-row"><div>Dl</div><div>Dt</div><div>Dc</div><div>Dj</div><div>Dv</div><div>Ds</div><div>Dg</div></div>
      <div id="weekRow" class="cal-week-row"></div>
      <div id="weekExpandedPanel"></div>
    </div>

    <div id="calendarMonth">
      <div class="weekday-row"><div>Dl</div><div>Dt</div><div>Dc</div><div>Dj</div><div>Dv</div><div>Ds</div><div>Dg</div></div>
      <div id="monthGrid"></div>
    </div>
  </section>

  <!-- ===== PÀGINA: ESTADÍSTIQUES ===== -->
  <section class="page" id="page-stats">
    <div class="cal-toolbar">
      <div class="seg-toggle" id="statsViewToggle">
        <button data-view="week" class="active">Setmana</button>
        <button data-view="month">Mes</button>
      </div>
      <button class="btn-secondary" onclick="openObjectius()">🎯 Objectius</button>
    </div>
    <div class="period-nav">
      <button class="nav-btn" onclick="changeStatsPeriod(-1)">‹</button>
      <div class="period-label" id="statsPeriodLabel"></div>
      <button class="nav-btn" onclick="changeStatsPeriod(1)">›</button>
    </div>
    <div id="statsContent"></div>
  </section>

</main>

<nav class="tabs">
  <button class="tab-btn active" data-page="calendar"><span class="ic">📅</span>Calendari</button>
  <button class="tab-btn" data-page="stats"><span class="ic">📊</span>Stats</button>
</nav>

<button class="fab-refresh" id="fabRefresh" title="Refrescar dades">
  <svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M23 4v6h-6"/><path d="M1 20v-6h6"/>
    <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
  </svg>
</button>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box" id="modalBox"></div>
</div>

<div class="toast" id="toast"></div>

<div class="loading-overlay" id="loadingOverlay">
  <div class="loading-spinner-big"></div>
  <div class="loading-text">Carregant informació...</div>
</div>

<script>
/* ============ CONFIG ============ */
const API_URL = "https://script.google.com/macros/s/AKfycbzPBoyxKWUvSh_GZCH1jTvLx76NxDbkIkz6yXWVhYj5sed9RjR5CYT1wIkC5R8UplmV/exec";

const TIPUS_INFO = {
  "Gym":        {cls:"gym",      label:"Gym",        icon:"🏋️", color:"#3B6FD1"},
  "Classe Gym": {cls:"classe",   label:"Classe Gym",  icon:"🧘", color:"#E0954E"},
  "Exterior":   {cls:"exterior", label:"Exterior",    icon:"🏃", color:"#9B4FD9"}
};
const DEFAULT_DURATION = {"Gym":60, "Classe Gym":60, "Exterior":45};

/* ============ STATE ============ */
let STATE = { activitats: [], log: [], objectius: [] };
const DIES_CODI = ["D","L","M","X","J","V","S"]; // getDay(): 0=diumenge

/* ============ API ============ */
async function parseApiResponse(res){
  const text = await res.text();
  try{ return JSON.parse(text); }
  catch(e){ console.error("Resposta no-JSON:", text.slice(0,300)); throw new Error("Resposta inesperada del servidor"); }
}
async function apiGet(action, params={}){
  const qs = new URLSearchParams({action, _ts:Date.now(), ...params}).toString();
  const res = await fetch(`${API_URL}?${qs}`, {cache:"no-store"});
  return parseApiResponse(res);
}
async function apiPost(action, body={}){
  const res = await fetch(API_URL, {
    method:"POST", cache:"no-store",
    headers:{"Content-Type":"text/plain;charset=utf-8"},
    body: JSON.stringify({action, ...body})
  });
  return parseApiResponse(res);
}
function showToast(msg){
  const t = document.getElementById("toast");
  t.innerHTML = ""; t.textContent = msg; t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"), 1700);
}
let __undoFn = null;
function showUndoToast(msg, undoFn){
  const t = document.getElementById("toast");
  __undoFn = undoFn;
  t.innerHTML = `${msg} <span class="toast-undo" onclick="if(__undoFn){__undoFn();__undoFn=null;}document.getElementById('toast').classList.remove('show');">Desfer</span>`;
  t.classList.add("show");
  setTimeout(()=>{ t.classList.remove("show"); __undoFn=null; }, 4500);
}

/* ============ HELPERS DE DATA ============ */
function fmt(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function diaCodi(d){ return DIES_CODI[d.getDay()]; }
function parseTime(hhmm){
  if(!hhmm) return null;
  const [h,m] = String(hhmm).split(":").map(Number);
  return h*60 + (m||0);
}
function fmtHoraMin(min){
  const h = Math.floor(min/60), m = min%60;
  return String(h).padStart(2,"0")+":"+String(m).padStart(2,"0");
}
function mondayOf(d){ const r=new Date(d); const day=(r.getDay()+6)%7; r.setDate(r.getDate()-day); return r; }

function activitatsDelDia(d){
  const codi = diaCodi(d), dStr = fmt(d);
  return STATE.activitats.filter(a=>{
    if(String(a.Actiu).toUpperCase()!=="TRUE") return false;
    if(isOmesa(a.ID, dStr)) return false; // eliminada només aquest dia: no es mostra enlloc
    if(a.DataPuntual){ return a.DataPuntual===dStr; }
    if(!a.DiesSetmana || a.DiesSetmana==="Diari") return true;
    return a.DiesSetmana.split(",").map(s=>s.trim()).includes(codi);
  }).sort((a,b)=>{
    const ea = getEffectiveActivity(a, dStr), eb = getEffectiveActivity(b, dStr);
    return (parseTime(ea.HoraInici)||0)-(parseTime(eb.HoraInici)||0);
  });
}
function logEntry(activitatId, dStr){
  return STATE.log.find(l=>String(l.ActivitatID)===String(activitatId) && l.Data===dStr);
}
/** Retorna l'activitat amb els valors d'aquell dia concret aplicats (si hi ha una excepció puntual). */
function getEffectiveActivity(a, dStr){
  const l = logEntry(a.ID, dStr);
  if(!l) return a;
  const eff = {...a};
  if(l.NomOverride) eff.Nom = l.NomOverride;
  if(l.HoraIniciOverride) eff.HoraInici = l.HoraIniciOverride;
  if(l.HoraFiOverride) eff.HoraFi = l.HoraFiOverride;
  return eff;
}
function hasExcepcio(activitatId, dStr){
  const l = logEntry(activitatId, dStr);
  return !!(l && (l.NomOverride || l.HoraIniciOverride || l.HoraFiOverride));
}
function isCompletat(activitatId, dStr){
  const l = logEntry(activitatId, dStr);
  return l && String(l.Completat).toUpperCase()==="TRUE";
}
function isOmesa(activitatId, dStr){
  const l = logEntry(activitatId, dStr);
  return l && String(l.Omesa).toUpperCase()==="TRUE";
}
function isPerduda(activitatId, dStr){
  const todayStr = fmt(new Date());
  return dStr < todayStr && !isCompletat(activitatId, dStr) && !isOmesa(activitatId, dStr);
}
function effectiveRange(a){
  const start = parseTime(a.HoraInici);
  if(start===null) return null;
  let end;
  if(a.HoraFi) end = parseTime(a.HoraFi);
  else if(a.Tipus==="Gym" && a.DuradaMin) end = start + Number(a.DuradaMin);
  else end = start + (DEFAULT_DURATION[a.Tipus]||60);
  return {start, end};
}

/* ============ CALENDARI: estat de vista ============ */
let calViewMode = "month";
let calRefDate = new Date();

document.getElementById("mainViewToggle").addEventListener("click", e=>{
  if(e.target.tagName!=="BUTTON") return;
  document.querySelectorAll("#mainViewToggle button").forEach(b=>b.classList.remove("active"));
  e.target.classList.add("active");
  calViewMode = e.target.dataset.view;
  document.getElementById("calendarWeek").style.display = calViewMode==="week" ? "block":"none";
  document.getElementById("calendarMonth").style.display = calViewMode==="month" ? "block":"none";
  renderCalendarView();
});
function changePeriod(delta){
  if(calViewMode==="week") calRefDate.setDate(calRefDate.getDate() + delta*7);
  else calRefDate.setMonth(calRefDate.getMonth() + delta);
  renderCalendarView();
}
function renderCalendarView(){
  renderCalGoalsStrip();
  if(calViewMode==="week"){
    const mon = mondayOf(calRefDate);
    const sun = new Date(mon); sun.setDate(mon.getDate()+6);
    const lbl = mon.toLocaleDateString('ca-ES',{day:'numeric',month:'short'}) + " – " + sun.toLocaleDateString('ca-ES',{day:'numeric',month:'short',year:'numeric'});
    document.getElementById("periodLabel").textContent = lbl;
    renderWeekRow();
  } else {
    const lblRaw = calRefDate.toLocaleDateString('ca-ES',{month:'long',year:'numeric'});
    document.getElementById("periodLabel").textContent = lblRaw.charAt(0).toUpperCase()+lblRaw.slice(1);
    renderMonthGrid();
  }
}
/** Franja compacta amb el progrés dels objectius setmanals, sempre de la setmana real actual. */
function renderCalGoalsStrip(){
  const cont = document.getElementById("calGoalsStrip");
  if(!cont) return;
  const goals = STATE.objectius.filter(o=>o.Periode==="Setmanal");
  if(!goals.length){ cont.innerHTML = ""; return; }

  const mon = mondayOf(new Date());
  const dies = []; for(let i=0;i<7;i++){ const d=new Date(mon); d.setDate(mon.getDate()+i); dies.push(d); }
  const perTipus = {};
  dies.forEach(d=>{
    const dStr = fmt(d);
    activitatsDelDia(d).forEach(a=>{
      if(isOmesa(a.ID,dStr)) return;
      perTipus[a.Tipus] = perTipus[a.Tipus] || {fet:0, min:0, km:0};
      if(isCompletat(a.ID,dStr)){
        perTipus[a.Tipus].fet++;
        const range = effectiveRange(a);
        if(range) perTipus[a.Tipus].min += (range.end-range.start);
        if(a.Kms) perTipus[a.Tipus].km += Number(a.Kms)||0;
      }
    });
  });
  const totalFet = Object.values(perTipus).reduce((s,t)=>s+t.fet,0);
  const totalMin = Object.values(perTipus).reduce((s,t)=>s+t.min,0);
  const totalKm = Object.values(perTipus).reduce((s,t)=>s+t.km,0);

  const pills = goals.map(g=>{
    let actual=0, unitat="";
    const td = perTipus[g.Tipus];
    if(g.Metrica==="Sessions"){ actual = g.Tipus==="Total" ? totalFet : (td?td.fet:0); }
    else if(g.Metrica==="Minuts"){ actual = Math.round(g.Tipus==="Total" ? totalMin : (td?td.min:0)); unitat="min"; }
    else if(g.Metrica==="Kms"){ actual = Math.round((g.Tipus==="Total" ? totalKm : (td?td.km:0))*10)/10; unitat="km"; }
    const pct = Math.min(100, Math.round((actual/Number(g.Valor))*100)||0);
    const done = actual >= Number(g.Valor);
    const barColor = g.Tipus!=="Total" && TIPUS_INFO[g.Tipus] ? `var(--${TIPUS_INFO[g.Tipus].cls})` : "var(--text)";
    return `<div class="goal-pill ${done?'done':''}" onclick="showAllPage('stats')">
      <span>🎯 ${g.Tipus} · ${actual}/${g.Valor}${unitat?' '+unitat:''}</span>
      <div class="gp-bar"><div class="gp-fill" style="width:${pct}%;background:${barColor};"></div></div>
    </div>`;
  }).join("");
  cont.innerHTML = `<div class="goal-strip">${pills}</div>`;
}
function showAllPage(page){
  document.querySelector(`.tab-btn[data-page="${page}"]`).click();
}

/* ============ CEL·LA DE DIA (compartida entre setmana i mes) ============ */
let calExpandedDate = fmt(new Date());
function diaStatusClass(dStr, todayStr){
  if(dStr===todayStr) return "today";
  return dStr < todayStr ? "past" : "future";
}
function toggleDayExpand(dStr){
  calExpandedDate = (calExpandedDate===dStr) ? null : dStr;
  renderCalendarView();
}
function diaCompletionClass(acts, dStr, status){
  if(status==="future" || !acts.length) return "";
  const rellevants = acts.filter(a=>!isOmesa(a.ID, dStr));
  if(!rellevants.length) return ""; // tot omès aquell dia, no compta
  return rellevants.every(a=>isCompletat(a.ID, dStr)) ? "day-done" : "day-pending";
}
function buildDayCell(d, outside){
  const dStr = fmt(d);
  const todayStr = fmt(new Date());
  const acts = outside ? [] : activitatsDelDia(d);
  const MAX_LINES = 2;
  const visible = acts.slice(0, MAX_LINES);
  const linesHtml = visible.map(a=>{
    const eff = getEffectiveActivity(a, dStr);
    const info = TIPUS_INFO[a.Tipus] || TIPUS_INFO["Gym"];
    const missed = isPerduda(a.ID, dStr);
    const omesa = isOmesa(a.ID, dStr);
    return `<div class="day-line ${info.cls} ${missed?'missed':''} ${omesa?'omesa':''}">
      <div class="dl-time">${eff.HoraInici||'--:--'}</div>
      <div class="dl-name">${eff.Nom||info.label}</div>
    </div>`;
  }).join("");
  const moreHtml = acts.length>MAX_LINES ? `<div class="day-more">+${acts.length-MAX_LINES} més</div>` : "";
  const status = diaStatusClass(dStr, todayStr);
  const completionCls = diaCompletionClass(acts, dStr, status);
  return `<div class="cal-day ${status} ${completionCls} ${outside?'outside':''} ${dStr===calExpandedDate?'expanded-sel':''}"
    onclick="${outside?'':`toggleDayExpand('${dStr}')`}">
    <div class="dnum">${d.getDate()}</div>
    <div class="day-lines">${linesHtml}${moreHtml}</div>
  </div>`;
}

/* ============ VISTA SETMANA ============ */
function renderWeekRow(){
  const mon = mondayOf(calRefDate);
  const days = []; for(let i=0;i<7;i++){ const d=new Date(mon); d.setDate(mon.getDate()+i); days.push(d); }
  document.getElementById("weekRow").innerHTML = days.map(d=>buildDayCell(d, false)).join("");
  const panel = document.getElementById("weekExpandedPanel");
  panel.innerHTML = (calExpandedDate && days.some(d=>fmt(d)===calExpandedDate)) ? renderDayExpandedPanel(calExpandedDate) : "";
}

/* ============ VISTA MES ============ */
function renderMonthGrid(){
  const year = calRefDate.getFullYear(), month = calRefDate.getMonth();
  const firstDay = new Date(year, month, 1);
  const startOffset = (firstDay.getDay()+6)%7;
  const daysInMonth = new Date(year, month+1, 0).getDate();

  let cells = [];
  for(let i=startOffset;i>0;i--){ const d=new Date(year,month,1-i); cells.push({date:d, outside:true}); }
  for(let day=1; day<=daysInMonth; day++){ cells.push({date:new Date(year,month,day), outside:false}); }
  while(cells.length % 7 !== 0){ const last=cells[cells.length-1].date; const d=new Date(last); d.setDate(d.getDate()+1); cells.push({date:d, outside:true}); }

  let html = "";
  for(let w=0; w<cells.length/7; w++){
    const weekCells = cells.slice(w*7, w*7+7);
    html += `<div class="cal-week-row">` + weekCells.map(c=>buildDayCell(c.date, c.outside)).join("") + `</div>`;
    if(calExpandedDate && weekCells.some(c=>fmt(c.date)===calExpandedDate)){
      html += renderDayExpandedPanel(calExpandedDate);
    }
  }
  document.getElementById("monthGrid").innerHTML = html;
}

/* ============ PANELL DESPLEGAT D'UN DIA (agenda ordenada per hora) ============ */
function renderDayExpandedPanel(dStr){
  const d = new Date(dStr+"T00:00:00");
  const labelRaw = d.toLocaleDateString('ca-ES',{weekday:'long',day:'numeric',month:'long'});
  const acts = activitatsDelDia(d); // ja ve ordenat per HoraInici
  const inner = acts.length ? acts.map(a=>{
    const eff = getEffectiveActivity(a, dStr);
    const info = TIPUS_INFO[a.Tipus] || TIPUS_INFO["Gym"];
    const done = isCompletat(a.ID, dStr);
    const missed = isPerduda(a.ID, dStr);
    const omesa = isOmesa(a.ID, dStr);
    const excepcio = hasExcepcio(a.ID, dStr);
    let tagExtra = "";
    if(omesa) tagExtra = ' · <span style="color:var(--text-muted);">omesa</span>';
    else if(missed) tagExtra = ' · <span style="color:var(--missed);">no completada</span>';
    if(excepcio) tagExtra += ' · <span style="color:var(--amber);">✎ dia modificat</span>';
    return `<div class="act-row ${info.cls} ${done?'completat':''} ${omesa?'omesa':''}" onclick="openActivityAction('${a.ID}','${dStr}')">
      <div class="time">${eff.HoraInici||'--:--'}</div>
      <div class="body">
        <div class="name ${done||omesa?'done':''}">${eff.Nom||info.label}</div>
        <div class="tag">${info.icon} ${info.label}${tagExtra}</div>
      </div>
      <div class="status">${done?'✅':(omesa?'⏭️':(missed?'⚠️':''))}<span class="chevron">›</span></div>
    </div>`;
  }).join("") : `<div class="empty">Cap activitat aquest dia.</div>`;
  return `<div class="day-expanded"><div class="day-expanded-title">${labelRaw}</div>${inner}</div>`;
}

/* ============ POPUP: ACCIÓ D'ACTIVITAT (Editar / Completar) ============ */
function openActivityAction(activitatId, dStr){
  const a = STATE.activitats.find(x=>String(x.ID)===String(activitatId));
  if(!a) return;
  const eff = getEffectiveActivity(a, dStr);
  const info = TIPUS_INFO[a.Tipus] || TIPUS_INFO["Gym"];
  const done = isCompletat(a.ID, dStr);
  const omesa = isOmesa(a.ID, dStr);
  const excepcio = hasExcepcio(a.ID, dStr);
  const l = logEntry(a.ID, dStr);
  const d = new Date(dStr+"T00:00:00");
  const labelRaw = d.toLocaleDateString('ca-ES',{weekday:'long',day:'numeric',month:'long'});
  const isRecurrent = !a.DataPuntual;

  let detailsHtml = `<div class="row" style="display:flex;justify-content:space-between;font-size:13px;color:var(--text-muted);margin-bottom:4px;"><span>${info.icon} ${info.label}</span><span class="mono">${eff.HoraInici||''}${eff.HoraFi?' - '+eff.HoraFi:''}</span></div>`;
  if(a.Exercicis) detailsHtml += `<div style="font-size:12.5px;white-space:pre-line;color:var(--text-muted);margin-top:6px;">${a.Exercicis}</div>`;
  if(a.Kms) detailsHtml += `<div style="font-size:12.5px;color:var(--text-muted);">📏 ${a.Kms} km${a.Desnivell?' · ⛰️ '+a.Desnivell+'m':''}</div>`;
  if(a.Notes) detailsHtml += `<div style="font-size:12.5px;color:var(--text-muted);margin-top:4px;">${a.Notes}</div>`;
  if(excepcio) detailsHtml += `<div style="font-size:11.5px;color:var(--amber);margin-top:6px;">✎ Aquest dia té un canvi puntual (hora/nom diferent del normal)</div>`;

  let statusHtml = "";
  if(done && l){
    statusHtml = `<div style="background:var(--gym-bg);border-radius:11px;padding:10px 12px;margin-top:12px;font-size:12.5px;color:var(--gym-text);">
      ✅ Completada${l.Dificultat?` · Dificultat ${l.Dificultat}/10`:''}${l.Satisfaccio?` · Satisfacció ${l.Satisfaccio}/10`:''}
      ${l.HoraEntradaReal?`<br>⏱️ ${l.HoraEntradaReal} - ${l.HoraSortidaReal||'?'}`:''}
    </div>`;
  } else if(omesa){
    statusHtml = `<div style="background:var(--surface-2);border-radius:11px;padding:10px 12px;margin-top:12px;font-size:12.5px;color:var(--text-muted);">
      ⏭️ Omesa aquest dia — no compta com a no completada
    </div>`;
  }

  let mainActionsHtml;
  if(done || omesa){
    mainActionsHtml = `<button class="btn-secondary" onclick="desferEstatDia('${a.ID}','${dStr}')">↺ Desfer</button>`;
  } else {
    mainActionsHtml = `<button class="btn-primary" style="flex:1;justify-content:center;" onclick="openCompleteForm('${a.ID}','${dStr}')">✓ Completar</button>`;
  }

  const editButtonsHtml = isRecurrent
    ? `<button class="btn-secondary" onclick="openExceptionForm('${a.ID}','${dStr}')">✎ Només aquest dia</button>
       <button class="btn-secondary" onclick="openActivityForm('${a.ID}')">✎ Tota la programació</button>`
    : `<button class="btn-secondary" onclick="openActivityForm('${a.ID}')">✎ Editar</button>`;

  openModal(`
    <h3 class="modal-title">${eff.Nom || info.label}</h3>
    <p style="font-size:12px;color:var(--text-muted);text-transform:capitalize;margin:-8px 0 12px;">${labelRaw}</p>
    ${detailsHtml}
    ${statusHtml}
    <div class="form-actions">${editButtonsHtml}</div>
    <div class="form-actions" style="margin-top:8px;">${mainActionsHtml}</div>
    ${(!done && !omesa) ? `<button class="btn-danger" style="width:100%;margin-top:8px;" onclick="ometreDiaClick('${a.ID}','${dStr}')">🗑 Eliminar només aquest dia${isRecurrent?' (no afecta els altres)':''}</button>` : ''}
    <button class="btn-danger" style="width:100%;margin-top:8px;" onclick="eliminarActivitatClick('${a.ID}')">🗑 Eliminar tota la programació</button>
  `);
}

/* ============ POPUP: EXCEPCIÓ D'UN SOL DIA (nom/hora diferents només aquell dia) ============ */
function openExceptionForm(activitatId, dStr){
  const a = STATE.activitats.find(x=>String(x.ID)===String(activitatId));
  if(!a) return;
  const eff = getEffectiveActivity(a, dStr);
  const excepcio = hasExcepcio(a.ID, dStr);
  const d = new Date(dStr+"T00:00:00");
  const labelRaw = d.toLocaleDateString('ca-ES',{weekday:'long',day:'numeric',month:'long'});
  openModal(`
    <h3 class="modal-title">Canvi puntual d'aquest dia</h3>
    <p style="font-size:12px;color:var(--text-muted);text-transform:capitalize;margin:-8px 0 12px;">${labelRaw} — no afecta la resta de la programació</p>
    <div class="form">
      <label>Nom</label>
      <input id="excNom" value="${String(eff.Nom||'').replace(/"/g,'&quot;')}">
      <div class="form-grid2">
        <div><label>Hora d'inici</label><input type="time" id="excHoraInici" value="${eff.HoraInici||''}"></div>
        <div><label>Hora de fi</label><input type="time" id="excHoraFi" value="${eff.HoraFi||''}"></div>
      </div>
      <div class="form-actions">
        <button class="btn-secondary" onclick="openActivityAction('${a.ID}','${dStr}')">Cancel·la</button>
        <button class="btn-primary" style="flex:1;justify-content:center;" onclick="guardarExcepcio('${a.ID}','${dStr}')">Desar per aquest dia</button>
      </div>
      ${excepcio ? `<button class="btn-secondary" style="width:100%;margin-top:8px;" onclick="treureExcepcio('${a.ID}','${dStr}')">↺ Treure el canvi puntual</button>` : ''}
    </div>
  `);
}
async function guardarExcepcio(activitatId, dStr){
  const a = STATE.activitats.find(x=>String(x.ID)===String(activitatId));
  const nom = document.getElementById("excNom").value.trim();
  const horaInici = document.getElementById("excHoraInici").value;
  const horaFi = document.getElementById("excHoraFi").value;
  if(!horaInici){ showToast("Indica l'hora d'inici"); return; }
  // Només es guarda com a "override" el que sigui diferent de la programació base
  const nomOverride = (nom && nom!==a.Nom) ? nom : "";
  const horaIniciOverride = (horaInici && horaInici!==a.HoraInici) ? horaInici : "";
  const horaFiOverride = (horaFi && horaFi!==(a.HoraFi||"")) ? horaFi : "";

  const backup = logEntry(activitatId, dStr) ? {...logEntry(activitatId, dStr)} : null;
  let l = logEntry(activitatId, dStr);
  if(!l){ l = {ID:"tmp", ActivitatID:activitatId, Data:dStr, Completat:false, Omesa:false}; STATE.log.push(l); }
  l.NomOverride = nomOverride; l.HoraIniciOverride = horaIniciOverride; l.HoraFiOverride = horaFiOverride;
  closeModal();
  renderCalendarView();
  showToast("Desant el canvi d'aquest dia...");
  try{
    const r = await apiPost("desarExcepcio", {activitatId, data:dStr, nomOverride, horaIniciOverride, horaFiOverride});
    if(!r || !r.ok) throw new Error(r&&r.error?r.error:"error desconegut");
    showToast("Canvi desat només per aquest dia ✅");
  }catch(err){
    if(backup){ Object.assign(logEntry(activitatId,dStr), backup); } else { STATE.log = STATE.log.filter(x=>x.ID!=="tmp"); }
    renderCalendarView();
    showToast("No s'ha pogut desar: "+err.message);
  }
}
async function treureExcepcio(activitatId, dStr){
  const backup = logEntry(activitatId, dStr) ? {...logEntry(activitatId, dStr)} : null;
  const l = logEntry(activitatId, dStr);
  if(l){ l.NomOverride=""; l.HoraIniciOverride=""; l.HoraFiOverride=""; }
  closeModal();
  renderCalendarView();
  try{
    const r = await apiPost("desarExcepcio", {activitatId, data:dStr, nomOverride:"", horaIniciOverride:"", horaFiOverride:""});
    if(!r || !r.ok) throw new Error(r&&r.error?r.error:"error desconegut");
    showToast("Torna a la programació normal");
  }catch(err){
    if(backup) Object.assign(logEntry(activitatId,dStr), backup);
    renderCalendarView();
    showToast("No s'ha pogut desar: "+err.message);
  }
}

async function desferEstatDia(activitatId, dStr){
  const l = logEntry(activitatId, dStr);
  const backup = l ? {...l} : null;
  if(l){ l.Completat = false; l.Omesa = false; }
  closeModal();
  renderCalendarView();
  if(document.getElementById("page-stats").classList.contains("active")) renderStats();
  try{
    const r = await apiPost("desferEstatDia", {activitatId, data:dStr});
    if(!r || !r.ok) throw new Error(r&&r.error?r.error:"error desconegut");
    showToast("Estat restablert");
  }catch(err){
    if(backup) Object.assign(logEntry(activitatId,dStr), backup);
    renderCalendarView();
    showToast("No s'ha pogut desar: "+err.message);
  }
}
async function ometreDiaClick(activitatId, dStr){
  const existent = logEntry(activitatId, dStr);
  const backup = existent ? {...existent} : null;
  if(existent){ existent.Completat=false; existent.Omesa=true; }
  else{ STATE.log.push({ID:"tmp",ActivitatID:activitatId, Data:dStr, Completat:false, Omesa:true, Notes:""}); }
  closeModal();
  renderCalendarView();
  if(document.getElementById("page-stats").classList.contains("active")) renderStats();
  try{
    const r = await apiPost("marcarOmesa", {activitatId, data:dStr});
    if(!r || !r.ok) throw new Error(r&&r.error?r.error:"error desconegut");
    showUndoToast("Eliminada d'aquest dia", ()=>desferEstatDia(activitatId, dStr));
  }catch(err){
    if(backup) Object.assign(logEntry(activitatId,dStr), backup);
    else{ STATE.log = STATE.log.filter(l=>l.ID!=="tmp"); }
    renderCalendarView();

/* ============ ESTADÍSTIQUES ============ */
let statsViewMode = "week";
let statsRefDate = new Date();
let statsCharts = {};

document.getElementById("statsViewToggle").addEventListener("click", e=>{
  if(e.target.tagName!=="BUTTON") return;
  document.querySelectorAll("#statsViewToggle button").forEach(b=>b.classList.remove("active"));
  e.target.classList.add("active");
  statsViewMode = e.target.dataset.view;
  renderStats();
});
function changeStatsPeriod(delta){
  if(statsViewMode==="week") statsRefDate.setDate(statsRefDate.getDate()+delta*7);
  else statsRefDate.setMonth(statsRefDate.getMonth()+delta);
  renderStats();
}
function getStatsRange(){
  if(statsViewMode==="week"){
    const mon = mondayOf(statsRefDate);
    const dies = []; for(let i=0;i<7;i++){ const d=new Date(mon); d.setDate(mon.getDate()+i); dies.push(d); }
    return dies;
  } else {
    const year = statsRefDate.getFullYear(), month = statsRefDate.getMonth();
    const daysInMonth = new Date(year, month+1, 0).getDate();
    const dies = []; for(let day=1; day<=daysInMonth; day++){ dies.push(new Date(year,month,day)); }
    return dies;
  }
}
function drawChart(canvasId, type, labels, datasets, opts={}){
  const el = document.getElementById(canvasId);
  if(!el) return;
  const ctx = el.getContext("2d");
  if(statsCharts[canvasId]) statsCharts[canvasId].destroy();
  const noScales = (type==="doughnut"||type==="pie");
  statsCharts[canvasId] = new Chart(ctx, {
    type, data:{labels, datasets},
    options:{
      responsive:true, maintainAspectRatio:false,
      plugins:{legend:{display:noScales, position:"bottom", labels:{color:"#767F73",font:{size:11}}}},
      scales: noScales ? {} : {
        x:{ticks:{color:"#767F73",font:{size:10}}, grid:{color:"#EFF1EA"}},
        y:{ticks:{color:"#767F73",font:{size:10}}, grid:{color:"#EFF1EA"}}
      },
      ...opts
    }
  });
}
function renderStats(){
  const dies = getStatsRange();
  const todayStr = fmt(new Date());
  const desde = fmt(dies[0]), fins = fmt(dies[dies.length-1]);

  const lblRaw = statsViewMode==="week"
    ? dies[0].toLocaleDateString('ca-ES',{day:'numeric',month:'short'}) + " – " + dies[6].toLocaleDateString('ca-ES',{day:'numeric',month:'short'})
    : statsRefDate.toLocaleDateString('ca-ES',{month:'long',year:'numeric'});
  document.getElementById("statsPeriodLabel").textContent = lblRaw.charAt(0).toUpperCase()+lblRaw.slice(1);

  // Recopilar totes les ocurrències del període (les eliminades d'un dia concret ja no arriben aquí)
  let occ = [];
  dies.forEach(d=>{
    const dStr = fmt(d);
    activitatsDelDia(d).forEach(a=>{ occ.push({a, dStr}); });
  });

  const total = occ.length;
  const completades = occ.filter(o=>isCompletat(o.a.ID,o.dStr));
  const perdudes = occ.filter(o=>isPerduda(o.a.ID,o.dStr));
  const pctCompliment = total ? Math.round((completades.length/total)*100) : 0;

  // KPIs per tipus
  const perTipus = {"Gym":{total:0,fet:0}, "Classe Gym":{total:0,fet:0}, "Exterior":{total:0,fet:0}};
  occ.forEach(o=>{
    if(!perTipus[o.a.Tipus]) perTipus[o.a.Tipus]={total:0,fet:0};
    perTipus[o.a.Tipus].total++;
    if(isCompletat(o.a.ID,o.dStr)) perTipus[o.a.Tipus].fet++;
  });

  // Dificultat/satisfacció mitjanes, minuts, kms
  let sumDif=0,nDif=0,sumSat=0,nSat=0,totalMin=0,totalKm=0;
  completades.forEach(o=>{
    const l = logEntry(o.a.ID,o.dStr);
    if(l && l.Dificultat!==""&&l.Dificultat!==undefined){ sumDif+=Number(l.Dificultat); nDif++; }
    if(l && l.Satisfaccio!==""&&l.Satisfaccio!==undefined){ sumSat+=Number(l.Satisfaccio); nSat++; }
    const range = effectiveRange(o.a);
    if(range) totalMin += (range.end-range.start);
    if(o.a.Kms) totalKm += Number(o.a.Kms)||0;
  });
  const avgDif = nDif? (sumDif/nDif).toFixed(1) : "–";
  const avgSat = nSat? (sumSat/nSat).toFixed(1) : "–";

  let html = `
    <div class="stat-grid">
      <div class="stat-box"><div class="num">${completades.length}/${total}</div><div class="lbl">Sessions completades</div></div>
      <div class="stat-box"><div class="num">${pctCompliment}%</div><div class="lbl">% compliment</div></div>
    </div>
    <div class="stat-grid cols3">
      <div class="stat-box"><div class="num" style="color:var(--missed);">${perdudes.length}</div><div class="lbl">No completades</div></div>
      <div class="stat-box"><div class="num">${avgDif}</div><div class="lbl">Dificultat mitjana</div></div>
      <div class="stat-box"><div class="num">${avgSat}</div><div class="lbl">Satisfacció mitjana</div></div>
    </div>
    <div class="stat-grid cols3">
      <div class="stat-box"><div class="num">${Math.round(totalMin/60*10)/10}h</div><div class="lbl">Temps entrenat</div></div>
      <div class="stat-box"><div class="num">${totalKm?totalKm.toFixed(1):'–'}</div><div class="lbl">Km (Exterior)</div></div>
      <div class="stat-box"><div class="num">${perTipus["Gym"].fet}</div><div class="lbl">Sessions Gym</div></div>
    </div>

    <div class="section-title">Sessions per tipus</div>
    <div class="chart-wrap"><canvas id="chartTipus"></canvas></div>

    <div class="section-title">Compliment del període</div>
    <div class="chart-wrap"><canvas id="chartCompliment"></canvas></div>

    <div class="section-title">Tendència (últimes ${statsViewMode==="week"?"8 setmanes":"6 mesos"})</div>
    <div class="chart-wrap"><canvas id="chartTrend"></canvas></div>

    <div class="section-title">Objectius d'aquest ${statsViewMode==="week"?"setmana":"mes"}</div>
    <div id="goalsProgress"></div>
  `;
  document.getElementById("statsContent").innerHTML = html;

  const tipusLabels = Object.keys(perTipus).filter(k=>perTipus[k].total>0);
  drawChart("chartTipus","bar", tipusLabels,
    [{label:"Fetes", data:tipusLabels.map(k=>perTipus[k].fet), backgroundColor:tipusLabels.map(k=>TIPUS_INFO[k].color)},
     {label:"Programades", data:tipusLabels.map(k=>perTipus[k].total), backgroundColor:tipusLabels.map(k=>TIPUS_INFO[k].color+"55")}]);

  const complimentPerDia = dies.map(d=>{
    const dStr = fmt(d);
    const dOcc = activitatsDelDia(d);
    if(!dOcc.length) return null;
    const fetes = dOcc.filter(a=>isCompletat(a.ID,dStr)).length;
    return Math.round((fetes/dOcc.length)*100);
  });
  drawChart("chartCompliment","line", dies.map(d=>d.toLocaleDateString('ca-ES',{day:'numeric',month:statsViewMode==='month'?undefined:'numeric'})),
    [{label:"% compliment", data:complimentPerDia, borderColor:"#3B6FD1", backgroundColor:"rgba(59,111,209,.15)", fill:true, tension:.3}]);

  const trend = computeTrendData();
  drawChart("chartTrend","line", trend.labels,
    [{label:"% compliment", data:trend.data, borderColor:"#9B4FD9", backgroundColor:"rgba(155,79,217,.12)", fill:true, tension:.3, spanGaps:true}]);

  renderGoalsProgress(perTipus, totalMin, totalKm);
}
/** Calcula el % de compliment de cada un dels últims N períodes (setmanes o mesos), sempre respecte avui. */
function computeTrendData(){
  const nPeriods = statsViewMode==="week" ? 8 : 6;
  const labels = [], data = [];
  for(let i=nPeriods-1; i>=0; i--){
    let periodDies = [], label;
    if(statsViewMode==="week"){
      const ref = new Date(); ref.setDate(ref.getDate() - i*7);
      const mon = mondayOf(ref);
      for(let j=0;j<7;j++){ const d=new Date(mon); d.setDate(mon.getDate()+j); periodDies.push(d); }
      label = mon.toLocaleDateString('ca-ES',{day:'numeric',month:'numeric'});
    } else {
      const ref = new Date(); ref.setDate(1); ref.setMonth(ref.getMonth()-i);
      const year=ref.getFullYear(), month=ref.getMonth();
      const daysInMonth = new Date(year, month+1, 0).getDate();
      for(let day=1; day<=daysInMonth; day++){ periodDies.push(new Date(year,month,day)); }
      const lbl = ref.toLocaleDateString('ca-ES',{month:'short'});
      label = lbl.charAt(0).toUpperCase()+lbl.slice(1);
    }
    let t=0, f=0;
    periodDies.forEach(d=>{
      const dStr = fmt(d);
      activitatsDelDia(d).forEach(a=>{
        if(isOmesa(a.ID,dStr)) return;
        t++; if(isCompletat(a.ID,dStr)) f++;
      });
    });
    labels.push(label);
    data.push(t ? Math.round((f/t)*100) : null);
  }
  return {labels, data};
}
function renderGoalsProgress(perTipus, totalMin, totalKm){
  const periode = statsViewMode==="week" ? "Setmanal" : "Mensual";
  const goals = STATE.objectius.filter(o=>o.Periode===periode);
  const cont = document.getElementById("goalsProgress");
  if(!goals.length){ cont.innerHTML = `<div class="empty">Encara no has definit objectius ${periode==='Setmanal'?'setmanals':'mensuals'}.</div>`; return; }
  cont.innerHTML = goals.map(g=>{
    let actual = 0, unitat = "";
    if(g.Metrica==="Sessions"){ actual = g.Tipus==="Total" ? Object.values(perTipus).reduce((s,t)=>s+t.fet,0) : (perTipus[g.Tipus]?perTipus[g.Tipus].fet:0); unitat="sessions"; }
    else if(g.Metrica==="Minuts"){ actual = Math.round(totalMin); unitat="min"; }
    else if(g.Metrica==="Kms"){ actual = Math.round(totalKm*10)/10; unitat="km"; }
    const pct = Math.min(100, Math.round((actual/Number(g.Valor))*100)||0);
    return `<div class="goal-card">
      <div class="row"><span>${g.Tipus} · ${g.Metrica}</span><span class="mono">${actual}/${g.Valor} ${unitat}</span></div>
      <div class="goal-bar"><div class="goal-bar-fill" style="width:${pct}%;"></div></div>
    </div>`;
  }).join("");
}

/* ============ POPUP: OBJECTIUS ============ */
function openObjectius(){
  openModal(`
    <h3 class="modal-title">Objectius</h3>
    <div id="objectiusList"></div>
    <div class="section-title">Nou objectiu</div>
    <div class="form">
      <label>Període</label>
      <select id="objPeriode"><option>Setmanal</option><option>Mensual</option></select>
      <label>Tipus</label>
      <select id="objTipus"><option>Total</option><option>Gym</option><option>Classe Gym</option><option>Exterior</option></select>
      <label>Mètrica</label>
      <select id="objMetrica"><option>Sessions</option><option>Minuts</option><option>Kms</option></select>
      <label>Valor objectiu</label>
      <input id="objValor" type="number" placeholder="3">
      <button class="btn-primary" style="width:100%;justify-content:center;margin-top:12px;" onclick="afegirObjectiuClick()">Guardar objectiu</button>
    </div>
  `);
  renderObjectiusList();
}
function renderObjectiusList(){
  const cont = document.getElementById("objectiusList");
  if(!cont) return;
  if(!STATE.objectius.length){ cont.innerHTML = `<div class="empty">Encara no hi ha objectius.</div>`; return; }
  cont.innerHTML = STATE.objectius.map(g=>`<div class="goal-card">
    <div class="row" style="align-items:center;">
      <span>${g.Periode} · ${g.Tipus} · ${g.Metrica}: <b class="mono">${g.Valor}</b></span>
      <div class="icon-btn-del" style="cursor:pointer;color:var(--missed);font-size:13px;" onclick="eliminarObjectiuClick('${g.ID}')">🗑</div>
    </div>
  </div>`).join("");
}
async function afegirObjectiuClick(){
  const periode = document.getElementById("objPeriode").value;
  const tipus = document.getElementById("objTipus").value;
  const metrica = document.getElementById("objMetrica").value;
  const valor = document.getElementById("objValor").value;
  if(!valor){ showToast("Indica un valor"); return; }
  const tempId = "tmp_"+Date.now();
  STATE.objectius.push({ID:tempId, Periode:periode, Tipus:tipus, Metrica:metrica, Valor:valor});
  renderObjectiusList();
  renderCalGoalsStrip();
  showToast("Desant...");
  try{
    const r = await apiPost("afegirObjectiu", {periode, tipus, metrica, valor});
    if(!r || !r.ok) throw new Error(r&&r.error?r.error:"error desconegut");
    const it = STATE.objectius.find(g=>g.ID===tempId); if(it && r.id) it.ID = r.id;
    showToast("Objectiu desat");
  }catch(err){
    STATE.objectius = STATE.objectius.filter(g=>g.ID!==tempId);
    renderObjectiusList(); renderCalGoalsStrip();
    showToast("No s'ha pogut desar: "+err.message);
  }
}
async function eliminarObjectiuClick(id){
  const backup = STATE.objectius.find(g=>String(g.ID)===String(id));
  STATE.objectius = STATE.objectius.filter(g=>String(g.ID)!==String(id));
  renderObjectiusList();
  renderCalGoalsStrip();
  try{
    const r = await apiPost("eliminarObjectiu", {id});
    if(!r || !r.ok) throw new Error(r&&r.error?r.error:"error desconegut");
    showToast("Objectiu eliminat");
  }catch(err){
    if(backup) STATE.objectius.push(backup);
    renderObjectiusList(); renderCalGoalsStrip();
    showToast("No s'ha pogut eliminar: "+err.message);
  }
}

/* ============ GEST DE LLISCAR (swipe) ENTRE PERÍODES ============ */
(function(){
  const cal = document.getElementById("page-calendar");
  let sx=0, sy=0, active=false;
  cal.addEventListener("touchstart", e=>{
    if(e.touches.length!==1) return;
    sx = e.touches[0].clientX; sy = e.touches[0].clientY; active = true;
  }, {passive:true});
  cal.addEventListener("touchend", e=>{
    if(!active) return; active = false;
    const dx = e.changedTouches[0].clientX - sx;
    const dy = e.changedTouches[0].clientY - sy;
    if(Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy)*1.4){
      changePeriod(dx<0 ? 1 : -1);
    }
  }, {passive:true});
})();

/* ============ OVERLAY DE CÀRREGA ============ */
function showLoading(){ document.getElementById("loadingOverlay").classList.remove("hidden"); }
function hideLoading(){ document.getElementById("loadingOverlay").classList.add("hidden"); }

/* ============ REFRESC MANUAL ============ */
document.getElementById("fabRefresh").addEventListener("click", async ()=>{
  const btn = document.getElementById("fabRefresh");
  if(btn.classList.contains("spinning")) return;
  btn.classList.add("spinning");
  showLoading();
  try{ await loadAll(); showToast("Dades actualitzades"); }
  catch(err){ showToast("Error refrescant"); }
  finally{ btn.classList.remove("spinning"); hideLoading(); }
});

/* ============ INIT ============ */
showLoading();
loadAll()
  .catch(err=>{ console.error(err); showToast("Error carregant dades inicials"); })
  .finally(hideLoading);

if("serviceWorker" in navigator){
  navigator.serviceWorker.register("sw.js").catch(()=>{});
}
